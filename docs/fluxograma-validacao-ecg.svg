<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2100" viewBox="0 0 1400 2100" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma de Validação de ECG</title>
  <desc id="desc">Fluxo de 30 dias para login, home, validação diária de ECG e revalidação geral no dia 30.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5f9f" />
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e4a78" flood-opacity="0.14" />
    </filter>
    <style>
      .page { fill: #eef4fb; }
      .title { fill: #0b2a4a; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 42px; font-weight: 800; }
      .subtitle { fill: #52657a; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 600; }
      .box { fill: #ffffff; stroke: #cfe0f3; stroke-width: 2; filter: url(#softShadow); }
      .box-accent { fill: #fbfdff; stroke: #2f5f9f; stroke-width: 3; filter: url(#softShadow); }
      .decision { fill: #fff8e7; stroke: #f2b94b; stroke-width: 3; filter: url(#softShadow); }
      .terminal { fill: #e8f1fb; stroke: #2f5f9f; stroke-width: 3; filter: url(#softShadow); }
      .day30 { fill: #eef9f2; stroke: #198754; stroke-width: 3; filter: url(#softShadow); }
      .label { fill: #0b2a4a; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 24px; font-weight: 800; }
      .text { fill: #34506f; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 600; }
      .small { fill: #52657a; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .arrow { fill: none; stroke: #2f5f9f; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #2f5f9f; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .yesno { fill: #2f5f9f; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1400" height="2100" />
  <text class="title" x="700" y="70" text-anchor="middle">Fluxograma de Validação de ECG</text>
  <text class="subtitle" x="700" y="110" text-anchor="middle">Ciclo diário de validação e revalidação geral no dia 30</text>

  <rect class="terminal" x="450" y="155" width="500" height="82" rx="41" />
  <text class="label" x="700" y="205" text-anchor="middle">Início do ciclo de validação</text>

  <line class="arrow" x1="700" y1="237" x2="700" y2="285" />

  <rect class="box-accent" x="370" y="285" width="660" height="126" rx="16" />
  <text class="label" x="700" y="325" text-anchor="middle">Dia 1 - Login</text>
  <text class="text" x="700" y="360" text-anchor="middle">Tela de login com login e senha</text>
  <text class="small" x="700" y="390" text-anchor="middle">Indica dia da semana + tipo de ECG do dia</text>

  <line class="arrow" x1="700" y1="411" x2="700" y2="455" />

  <rect class="box" x="370" y="455" width="660" height="104" rx="16" />
  <text class="label" x="700" y="495" text-anchor="middle">Home</text>
  <text class="text" x="700" y="530" text-anchor="middle">Fila de trabalho e exames disponíveis</text>

  <line class="arrow" x1="700" y1="559" x2="700" y2="600" />

  <rect class="box" x="370" y="600" width="660" height="120" rx="16" />
  <text class="label" x="700" y="640" text-anchor="middle">Tela de validação do ECG</text>
  <text class="text" x="700" y="675" text-anchor="middle">Revisar diagnóstico, imagem do ECG e dados clínicos</text>
  <text class="small" x="700" y="705" text-anchor="middle">Depois da análise, volta para a fila do dia</text>

  <line class="arrow" x1="700" y1="720" x2="700" y2="770" />

  <path class="decision" d="M700 770 L1000 855 L700 940 L400 855 Z" />
  <text class="label" x="700" y="842" text-anchor="middle">Há outro exame</text>
  <text class="label" x="700" y="875" text-anchor="middle">para validar no dia?</text>

  <path class="loop" d="M400 855 H250 V507 H370" />
  <text class="yesno" x="310" y="835" text-anchor="middle">Sim</text>

  <line class="arrow" x1="700" y1="940" x2="700" y2="990" />
  <text class="yesno" x="735" y="975">Não</text>

  <rect class="box" x="370" y="990" width="660" height="96" rx="16" />
  <text class="label" x="700" y="1030" text-anchor="middle">Encerrar validações do Dia 1</text>
  <text class="text" x="700" y="1062" text-anchor="middle">Fila diária concluída</text>

  <line class="arrow" x1="700" y1="1086" x2="700" y2="1130" />

  <rect class="box-accent" x="370" y="1130" width="660" height="126" rx="16" />
  <text class="label" x="700" y="1170" text-anchor="middle">Dia 2 - Login</text>
  <text class="text" x="700" y="1205" text-anchor="middle">Tela de login com login e senha</text>
  <text class="small" x="700" y="1235" text-anchor="middle">Novo dia da semana + tipo de ECG previsto</text>

  <line class="arrow" x1="700" y1="1256" x2="700" y2="1305" />

  <rect class="box" x="370" y="1305" width="660" height="104" rx="16" />
  <text class="label" x="700" y="1345" text-anchor="middle">Home</text>
  <text class="text" x="700" y="1380" text-anchor="middle">Fila de trabalho do Dia 2</text>

  <line class="arrow" x1="700" y1="1409" x2="700" y2="1450" />

  <rect class="box" x="370" y="1450" width="660" height="112" rx="16" />
  <text class="label" x="700" y="1490" text-anchor="middle">Tela de validação do ECG</text>
  <text class="text" x="700" y="1525" text-anchor="middle">Validar exames e retornar para a home</text>

  <line class="arrow" x1="700" y1="1562" x2="700" y2="1615" />

  <rect class="box-accent" x="300" y="1615" width="800" height="118" rx="16" />
  <text class="label" x="700" y="1655" text-anchor="middle">Repetir o padrão diário</text>
  <text class="text" x="700" y="1690" text-anchor="middle">Dias 3 até 29: Login → Home → Validação ECG → Home</text>
  <text class="small" x="700" y="1720" text-anchor="middle">Cada dia pode ter tipos diferentes de ECG e filas de exames</text>

  <line class="arrow" x1="700" y1="1733" x2="700" y2="1785" />

  <path class="decision" d="M700 1785 L990 1860 L700 1935 L410 1860 Z" />
  <text class="label" x="700" y="1852" text-anchor="middle">Chegou ao Dia 30?</text>
  <text class="small" x="700" y="1885" text-anchor="middle">Dia da revalidação geral</text>

  <path class="loop" d="M410 1860 H240 V1674 H300" />
  <text class="yesno" x="330" y="1840" text-anchor="middle">Não</text>

  <line class="arrow" x1="990" y1="1860" x2="1160" y2="1860" />
  <text class="yesno" x="1075" y="1840" text-anchor="middle">Sim</text>

  <rect class="day30" x="1080" y="1700" width="270" height="320" rx="18" />
  <text class="label" x="1215" y="1745" text-anchor="middle">Dia 30</text>
  <text class="text" x="1215" y="1785" text-anchor="middle">Login</text>
  <text class="small" x="1215" y="1815" text-anchor="middle">Revalidação geral</text>
  <line class="arrow" x1="1215" y1="1835" x2="1215" y2="1875" />
  <text class="text" x="1215" y="1910" text-anchor="middle">Home geral</text>
  <text class="small" x="1215" y="1940" text-anchor="middle">Todos os exames</text>
  <line class="arrow" x1="1215" y1="1960" x2="1215" y2="1995" />
  <text class="text" x="1215" y="2030" text-anchor="middle">Validação cuidadosa</text>

  <line class="arrow" x1="1080" y1="2020" x2="980" y2="2020" />

  <rect class="terminal" x="450" y="1976" width="530" height="84" rx="42" />
  <text class="label" x="715" y="2011" text-anchor="middle">Todos os exames revisados</text>
  <text class="text" x="715" y="2042" text-anchor="middle">Fim do ciclo de 30 dias</text>
</svg>
