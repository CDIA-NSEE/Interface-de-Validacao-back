[project]
name = "ecg-review-backend"
version = "0.1.0"
description = "API FastAPI da Plataforma de Revisao de ECG."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.0",
    "zstandard>=0.23.0",
    "dependency-injector>=4.42.0",
    "pydantic-settings>=2.5.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pymemcache>=4.0.0",
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
